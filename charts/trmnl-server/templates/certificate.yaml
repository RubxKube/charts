{{- if .Values.certificate.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.name }}-tls
spec:
  secretName: {{ .Values.certificate.secretName | default (printf "%s-tls" .Values.name) }}
  dnsNames:
    - {{ .Values.server.hostname }}
  issuerRef:
    name: {{ required "certificate.issuerRef.name is required when certificate.enabled" .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
{{- end }}
